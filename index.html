<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LittenLawliet27 — Fandom Hub</title>
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="description" content="A fandom hub: collections, external sites, and ARG answers." />
  <!-- CDN libs -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">LittenLawliet27 — Fandom Hub</div>
    <nav class="controls">
      <input id="search" placeholder="Search fandoms, ARGs, tags..." />
      <select id="typeFilter">
        <option value="all">All</option>
        <option value="fandom">Fandoms</option>
        <option value="site">Sites</option>
        <option value="arg">ARG Answers</option>
      </select>
      <button id="darkToggle">Dark</button>
    </nav>
  </header>

  <main>
    <section id="tagbar" class="tagbar"></section>
    <section id="grid" class="grid"></section>
  </main>

  <!-- Detail modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="modalClose" class="modal-close">✕</button>
      <h2 id="modalTitle"></h2>
      <div id="modalMeta" class="meta"></div>
      <div id="modalBody" class="detail-body"></div>
      <div id="modalLinks" class="links"></div>
    </div>
  </div>

  <footer class="footer">
    <small>Made by LittenLawliet27 — edit data/content.json to add items</small>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
